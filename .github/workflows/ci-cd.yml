name: CI/CD - API de Tarefas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1) CI: instala dependências e roda os testes
  testes:
    name: Validação e testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        run: npm test

  # 2) Build da imagem Docker e publicação no GHCR
  build-e-publicacao:
    name: Docker Build e push no GHCR
    needs: testes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 3) CD: atualiza a aplicação na VPS via SSH
  # Só roda de verdade quando os secrets da VPS estiverem cadastrados
  deploy:
    name: Deploy na VPS
    needs: build-e-publicacao
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Aviso (VPS ainda não configurada)
        if: env.VPS_HOST == ''
        run: echo "Secrets da VPS não configurados. Deploy pulado; a imagem já está publicada no GHCR."

      - name: Atualizar container na VPS
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            IMAGEM=ghcr.io/${{ github.repository }}:latest
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull $IMAGEM
            docker stop api-tarefas || true
            docker rm api-tarefas || true
            docker run -d --name api-tarefas --restart unless-stopped \
              -p 3000:3000 -e APP_VERSION=${{ github.sha }} $IMAGEM
            docker image prune -f
            curl -fsS http://localhost:3000/health
